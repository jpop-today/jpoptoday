name: app
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify contracts and app read model
        run: npm test
      - name: Check Astro types
        run: npm run check
      - name: Build static preview
        run: npm run build
      - name: Verify public artifact boundary
        run: npm run verify:dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser behavior
        run: npm run test:e2e
      - name: Preserve verified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: jpoptoday-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  production-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JPOP_BUILD_TARGET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: jpoptoday-production-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
