name: deployed-preview
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Dedicated jpoptoday-preview deployment HTTPS URL
        required: true
      source_sha:
        description: Full source SHA recorded in the deployed build-info.json
        required: true
permissions:
  contents: read
concurrency:
  group: preview-verification-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JPOP_TEST_BASE_URL: ${{ inputs.deployment_url }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - name: Verify deployed preview metadata and actual frozen bytes
        env:
          EXPECTED_TARGET: preview
        run: |
          npm run verify:deployment -- "$JPOP_TEST_BASE_URL" dist "$RUNNER_TEMP/jpop-preview-healthcheck.json"
      - name: Preserve healthcheck attempts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-healthcheck-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/jpop-preview-healthcheck.json
          if-no-files-found: warn
          retention-days: 30
      - run: npx playwright install --with-deps chromium
      - name: Verify actual Pages behavior
        run: npm run test:e2e
