name: deployed-preview
on:
  push:
    branches: ['codex/5-astro-app-preview']
    paths: ['.github/workflows/deployed-preview.yml']
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Dedicated jpoptoday-preview deployment HTTPS URL
        required: true
        default: 'https://f5700aaa.jpoptoday-preview.pages.dev'
      source_sha:
        description: Full source SHA recorded in the deployed build-info.json
        required: true
        default: '9cd5017883da50a5aabd702eb82d2ccb2e684ae1'
permissions:
  contents: read
jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JPOP_TEST_BASE_URL: ${{ inputs.deployment_url || 'https://f5700aaa.jpoptoday-preview.pages.dev' }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || '9cd5017883da50a5aabd702eb82d2ccb2e684ae1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || '9cd5017883da50a5aabd702eb82d2ccb2e684ae1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check deployment identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = new URL(process.env.JPOP_TEST_BASE_URL);
          assert.equal(url.protocol, 'https:');
          assert.match(url.hostname, /^(?:[a-z0-9-]+\.)?jpoptoday-preview\.pages\.dev$/);
          assert.match(process.env.EXPECTED_SOURCE_SHA, /^[a-f0-9]{40}$/);
          const response = await fetch(new URL('/build-info.json', url));
          assert.equal(response.status, 200);
          const info = await response.json();
          assert.equal(info.sourceSha, process.env.EXPECTED_SOURCE_SHA);
          assert.equal(info.dirty, false);
          console.log('Verified deployed source', info.sourceSha);
          JS
      - run: npx playwright install --with-deps chromium
      - name: Verify actual Pages behavior
        run: npm run test:e2e
