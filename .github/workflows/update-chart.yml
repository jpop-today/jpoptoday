name: update-chart
on:
  schedule:
    - cron: '0 1 * * 1' # Monday 10:00 Asia/Seoul
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-chart
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A failed fetch writes nothing, so earlier snapshots stay as they are and no PR is opened.
      - name: Collect TJ JPOP TOP100
        run: node scripts/fetch-tj-chart.mjs
      - name: Open data PR for the operator to merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          BRANCH="chart/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/chart-history
          git commit -m "chart: $DATE"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chart: $DATE" \
            --body "TJ JPOP TOP100 snapshot collected on $DATE (data/chart-history/$DATE.json). Merge to keep it."
