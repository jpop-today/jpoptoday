name: version-release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require reviewed main history and matching release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v\d+\.\d+\.\d+$/);
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          assert.equal(tag, `v${pkg.version}`);
          assert.ok((await readFile(`releases/${tag}.md`, 'utf8')).trim());
          console.log('Reviewed release identity verified', tag);
          JS
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run verify:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "jpop.today $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
      # GITHUB_TOKEN-created release events do not start another workflow.
      - name: Prepare release notification
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          const tag = process.env.RELEASE_TAG;
          await writeFile('/tmp/jpop-release-report.json', JSON.stringify({title: `릴리스 · ${tag}`, summary: '계약·타입·정적 산출물·Chromium 검증을 통과한 버전을 게시했습니다.', fields: [{name: '소스 SHA', value: process.env.GITHUB_SHA}, {name: '범위', value: '조직 앱 버전 릴리스. 기존 jpop.today 운영 전환·AdSense 승인은 별도 상태입니다.'}], url: `https://github.com/jpop-today/jpoptoday/releases/tag/${tag}`}));
          JS
      - name: Deliver release notice or skip missing secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/discord-notify.mjs /tmp/jpop-release-report.json
