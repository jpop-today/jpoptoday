name: production-deploy
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed main-history SHA with successful CI and preview
        required: true
      preview_url:
        description: Verified dedicated noindex preview deployment URL
        required: true
      verify_only:
        description: Verify an already deployed same-SHA production without deploying
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: jpop-today-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JPOP_BUILD_TARGET: production
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require reviewed main history and successful same-SHA app CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const sha = process.env.EXPECTED_SOURCE_SHA;
          assert.match(sha, /^[a-f0-9]{40}$/);
          const response = await fetch(`https://api.github.com/repos/jpop-today/jpoptoday/actions/workflows/app.yml/runs?head_sha=${sha}`, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
          assert.equal(response.status, 200);
          const runs = (await response.json()).workflow_runs;
          assert.ok(runs.some(run => run.head_sha === sha && run.conclusion === 'success'), 'Successful same-SHA preview/production app CI required');
          JS
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build and verify matching frozen preview artifact
        env:
          JPOP_BUILD_TARGET: preview
        run: |
          npm run build
          npm run verify:dist
          cp -R dist "$RUNNER_TEMP/jpop-preview-dist"
      - run: npm run build
      - run: npm run verify:dist
      - name: Compare frozen preview and production input identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const preview = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/jpop-preview-dist/build-info.json`, 'utf8'));
          const production = JSON.parse(await readFile('dist/build-info.json', 'utf8'));
          assert.equal(preview.target, 'preview'); assert.equal(production.target, 'production');
          assert.equal(preview.dirty, false); assert.equal(production.dirty, false);
          for (const field of ['sourceSha', 'legacyRevision', 'catalogSha256', 'ledgerSha256', 'chartSha256', 'songCount', 'currentSongCount']) assert.equal(preview[field], production[field]);
          JS
      - name: Verify actual same-source preview against frozen bytes
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_TARGET: preview
        run: |
          npm run verify:deployment -- "$PREVIEW_URL" "$RUNNER_TEMP/jpop-preview-dist" "$RUNNER_TEMP/jpop-preview-healthcheck.json"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check Actions deployment bindings without exposing values
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          const ready = Boolean(process.env.CLOUDFLARE_API_TOKEN && process.env.CLOUDFLARE_ACCOUNT_ID);
          await appendFile(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          console.log(ready ? 'Cloudflare Actions bindings configured' : 'Deployment skipped: Cloudflare Actions bindings missing; managed cloud deployment remains available');
          JS
      - name: Deploy verified organization artifact to existing jpop.today
        if: steps.credentials.outputs.ready == 'true' && !inputs.verify_only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production
      - name: Verify actual production SHA and browser behavior
        if: inputs.verify_only || steps.credentials.outputs.ready == 'true'
        env:
          JPOP_TEST_BASE_URL: https://jpop.today
          EXPECTED_TARGET: production
        run: |
          npm run verify:deployment -- https://jpop.today dist "$RUNNER_TEMP/jpop-production-healthcheck.json"
          npm run test:e2e
      - name: Preserve healthcheck attempts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-healthchecks-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/jpop-*-healthcheck.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ inputs.source_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
